name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches: [ main, master, product-ready, release/* ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master, product-ready, release/* ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  quality-gate:
    name: Quality Gate (Lint, Types, Tests, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: TypeScript Typecheck & Lint
        run: npm run lint

      - name: Pure-node selftests (strict — no soft-gate)
        run: npm run selftest

      - name: Unit tests (vitest)
        run: npm test
        env:
          DEMO_MODE: "1"

      - name: Verify Full Production Build
        run: |
          export KMS_MASTER_KEY="$(openssl rand -hex 24)"
          echo "KMS_MASTER_KEY generated for CI build (${#KMS_MASTER_KEY} chars)"
          npm run build
        env:
          NODE_ENV: production

      - name: npm audit (critical = fail)
        run: npm audit --audit-level=critical

      - name: Smoke (optional DEMO)
        run: npm run smoke || echo "::warning::smoke skipped or failed (non-blocking until DEMO harness stable)"
        env:
          DEMO_MODE: "1"
          KMS_MASTER_KEY: "ci-smoke-key-16chars"

  docker-build:
    name: Docker Container Build & Push
    runs-on: ubuntu-latest
    needs: quality-gate
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
