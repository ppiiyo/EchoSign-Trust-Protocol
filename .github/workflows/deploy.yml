name: CI/CD Pipeline & Automated Deployment

on:
  push:
    branches: [ main, master, release/* ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # 1. Quality & Linting Gate
  # ============================================================================
  quality-gate:
    name: 🧪 Quality Gate (Lint, Types, Build)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 22.x LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: 🔍 TypeScript Typecheck & Lint
        run: npm run lint

      - name: 🏗️ Verify Full Production Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: 🛡️ Audit NPM Dependencies
        run: npm audit --audit-level=high || true

  # ============================================================================
  # 2. Docker Container Build & Push
  # ============================================================================
  docker-build:
    name: 🐳 Docker Container Build & Push
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ steps.meta.outputs.version }}

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🔧 Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract Docker Metadata (Tags & Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short

      - name: 🚀 Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================================
  # 3. Automated Cloud Deployment (Cloud Run / On-Premise SSH / K8s)
  # ============================================================================
  deploy:
    name: 🚀 Deploy to Production
    needs: docker-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: production
      url: https://echosign.trustprotocol.io

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # Deployment Option A: Google Cloud Run (if GCP secrets provided)
      - name: ☁️ Authenticate to Google Cloud
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      - name: 🚀 Deploy to Google Cloud Run
        if: env.GCP_SA_KEY != ''
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: echosign-voice-inspector
          region: europe-west1
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          flags: '--port=3000 --min-instances=1 --max-instances=10 --cpu=2 --memory=2Gi --allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
            KMS_MASTER_KEY=${{ secrets.KMS_MASTER_KEY }}
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

      # Deployment Option B: Production Server via SSH / Docker Compose
      - name: 🖥️ Deploy to Server via SSH
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /opt/echosign-voice-inspector || exit 1
            git pull origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}

      # Healthcheck Verification
      - name: 🩺 Deployment Health Verification
        run: |
          echo "Deployment successful! Service image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
