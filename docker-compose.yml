services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: echosign
      POSTGRES_PASSWORD: echosign
      POSTGRES_DB: echosign
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echosign -d echosign"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: { context: ., dockerfile: Dockerfile }
    image: echosign/attest:0.5.0
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DEMO_MODE: ${DEMO_MODE:-0}
      DATABASE_URL: postgres://echosign:echosign@postgres:5432/echosign
      KMS_MASTER_KEY: ${KMS_MASTER_KEY:?set KMS_MASTER_KEY in .env}
      ATTEST_OFFLINE: ${ATTEST_OFFLINE:-0}
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - appdata:/app/data
    restart: unless-stopped
volumes:
  pgdata:
  appdata:
